<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Imposter va Mafia — doʻstlar bilan oʻyinlar" />
    <meta name="theme-color" content="#f7f7fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Maboys — Imposter & Mafia</title>
    <script>
      // Temani React yuklanishidan oldin qoʻllaymiz — "oq chaqnash" boʻlmasligi uchun.
      ;(function () {
        try {
          var raw = localStorage.getItem('maboys:theme')
          var mode = raw ? JSON.parse(raw).state.mode : 'system'
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
